name: Build and Release
on:
  push:
    tags:
      - "*.*"
permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: compile
        uses: xu-cheng/latex-action@v3
        with:
          root_file: index.tex
          latexmk_shell_escape: true

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: index.pdf
